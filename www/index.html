<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101217" />
    <meta name="description" content="台股 K 線、指標、畫線、AI 趨勢判斷與回放工具。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>TW K Radar</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark">K</div>
          <div>
            <div class="brand-name">TW K Radar</div>
            <div class="brand-subtitle">台股即時判讀工作台</div>
          </div>
        </div>
        <div class="top-status">
          <div id="sessionClock" class="market-clock">13:30 TPE</div>
          <div id="selectedTicker" class="ticker-pill">2330 台積電</div>
        </div>
      </header>

      <main id="view" class="view"></main>

      <nav class="bottom-nav" aria-label="主要分頁">
        <button class="nav-item is-active" data-page="home" type="button">
          <span class="nav-icon">⌂</span>
          <span>首頁</span>
        </button>
        <button class="nav-item" data-page="watchlist" type="button">
          <span class="nav-icon">★</span>
          <span>自選</span>
        </button>
        <button class="nav-item" data-page="chart" type="button">
          <span class="nav-icon">⌁</span>
          <span>K線</span>
        </button>
        <button class="nav-item" data-page="indicators" type="button">
          <span class="nav-icon">ƒ</span>
          <span>指標</span>
        </button>
        <button class="nav-item" data-page="settings" type="button">
          <span class="nav-icon">⚙</span>
          <span>設定</span>
        </button>
      </nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>
